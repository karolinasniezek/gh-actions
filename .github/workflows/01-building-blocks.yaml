name: Building Blocks Workflow
on: push
jobs:
  echo-hello:
    runs-on: ubuntu-latest
    steps:
      - name: Say Hey
        run: echo "Hey"
  goodbye-echo:
    runs-on: ubuntu-latest
    steps:
      - name: Successful step
        run: |
          echo "This step will succeed"
          exit 0
      - name: This will run
        run: echo "This step will run because the previous step succeeded"

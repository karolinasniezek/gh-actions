name: Building Blocks Workflow
on: push
jobs:
  echo-hello:
    runs-on: ubuntu-latest
    steps:
      - name: Say Hey
        run: echo "Hey"
  goodbye-echo:
    runs-on: ubuntu-latest
    steps:
      - name: Failed step
        run: |
          echo "This step will fail"
          exit 1
      - name: This will not run
        run: echo "This step will be skipped because the previous step failed"

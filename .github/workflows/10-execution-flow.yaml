name: 10 - Execution Flow

on:
  workflow_dispatch:
    inputs:
      pass-unit-tests:
        type: boolean
        description: Whether to pass unit tests
        default: true

jobs:
  lint-build:
    runs-on: ubuntu-latest
    steps:
      - name: Lint and build
        run: echo "Linting and building project..."
  unit-test:
    runs-on: ubuntu-latest
    continue-on-error: ${{ !inputs.pass-unit-tests }}
    steps:
      - name: Run unit tests
        run: echo "Running unit tests..."
      - name: Failing tests
        if: ${{ !inputs.pass-unit-tests}}
        run: |
          echo "Failing unit tests..."
          exit 1
  deploy-nonprod:
    runs-on: ubuntu-latest
    needs:
      - lint-build
      - unit-test
    steps:
      - name: Deploying to nonprod
        run: echo "Deploying to nonprod environment..."
  e2e-tests:
    runs-on: ubuntu-latest
    needs:
      - deploy-nonprod
    steps:
      - name: Run end-to-end tests
        run: echo "Running end-to-end tests..."
  load-tests:
    runs-on: ubuntu-latest
    needs:
      - deploy-nonprod
    steps:
      - name: Run load tests
        run: echo "Running load tests..."
  deploy-prod:
    runs-on: ubuntu-latest
    needs:
      - e2e-tests
      - load-tests
    steps:
      - name: Deploy to prod
        run: echo "Deploying to prod environment..."

name: 15 - Environments
on:
  workflow_dispatch:

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: staging
    env:
      my-env-value: ${{vars.MY_ENV_VALUE || 'default-value'}}
    steps:
      - name: Echo environment
        run: |
          echo "Target environment is staging"
          echo "Environment variable MY_ENV_VALUE is ${{env.my-env-value}}"
          echo "Running deploy-staging job"
  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Run E2E tests
        run: echo "Running E2E tests"
  deploy-prod:
    runs-on: ubuntu-latest
    needs: e2e-tests
    environment: prod
    env:
      my-env-value: ${{vars.MY_ENV_VALUE || 'default-value'}}
    steps:
      - name: Echo environment
        run: |
          echo "Target environment is production"
          echo "Environment variable MY_ENV_VALUE is ${{env.my-env-value}}"
          echo "Running deploy-prod job"

name: 15 - Environments

on:
  workflow_dispatch:
    inputs:
      target-env:
        type: environment
        description: "Select the target environment"
        required: true
        default: "staging"

jobs:
  echo:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.target-env }}
    env:
      my-env-value: ${{vars.MY_VAR || 'default-value'}}
    steps:
      - name: Echo environment
        run: |
          echo "Target environment is ${{ github.event.inputs.target-env }}"
          echo "Environment variable MY_VAR is ${{env.my-env-value}}"

name: 11 - Inputs

on:
  workflow_dispatch:
    inputs:
      dry-run:
        type: boolean
        description: Skip deployment and only print build output
        default: false
      target:
        type: environment
        description: Target environment for deployment
        required: true
      tag:
        type: choice
        options:
          - v1
          - v2
          - v3
        description: Release from which to build and deploy
        default: v1
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Build
        run: echo "Building for tag ${{ inputs.tag }}"
  deploy:
    runs-on: ubuntu-latest
    environment: ${{inputs.target}}
    if: ${{ !inputs.dry-run }}
    steps:
      - name: Deploy
        run: echo "Deploying to ${{ inputs.target }}"

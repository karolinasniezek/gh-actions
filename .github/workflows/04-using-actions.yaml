name: Using Actions
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Printing Folders
        run: ls
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "26.x"
      - name: Install Dependencies
        run: node ci

name: Using Actions
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./using-actions/react-app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Printing Folders
        run: ls
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "26.x"
      - name: Install Dependencies
        run: npm ci
      - name: Run Unit tests
        run: npm run test

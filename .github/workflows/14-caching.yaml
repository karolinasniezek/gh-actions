name: 14 - Caching

on:
  workflow_dispatch:
    inputs:
      use-cache:
        description: "Whether to use cache"
        required: true
        default: true
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 13-caching/react-app
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "26.x"
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm run test
      - name: Build project
        run: npm run build
      - name: Deploy to nonprod environment
        run: echo "Deploying to nonprod environment"

name: 12 - Workflow Outputs

on:
  workflow_dispatch:
    inputs:
      build-status:
        description: "Status of the build"
        required: true
        default: "success"
        type: choice
        options:
          - success
          - failure
      output1:
        description: "Value for output1"
        required: true
        default: "value1"
      output2:
        description: "Value for output2"
        required: true
        default: "value2"
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      build_status: ${{ steps.build.outputs.status }}
      output1: ${{ steps.build.outputs.output1 }}
      output2: ${{ steps.build.outputs.output2 }}
      mistake: ${{ steps.mistake.outputs.mistake }}
    steps:
      - name: Print GITHUB_OUTPUT path
        run: echo "$GITHUB_OUTPUT"
      - name: Build
        id: build
        run: |
          echo "$GITHUB_OUTPUT"
          echo "status=${{inputs.build-status}}" >> "$GITHUB_OUTPUT"
          echo "output1=${{inputs.output1}}" >> "$GITHUB_OUTPUT"
          echo "output2=${{inputs.output2}}" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"
      - name: Step with mistake
        id: mistake
        run: |
          echo "mistake=true" > "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"
  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: ${{needs.build.outputs.build_status == 'success'}}
    steps:
      - name: Deploy
        run: echo "Deploying because build was successful"
      - name: Print Outputs
        run: |
          echo "Build Status: ${{needs.build.outputs.build_status}}"
          echo "Output1: ${{needs.build.outputs.output1}}"
          echo "Output2: ${{needs.build.outputs.output2}}"
          echo "Mistake: ${{needs.build.outputs.mistake}}"

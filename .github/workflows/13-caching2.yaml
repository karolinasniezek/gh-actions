name: 13 - Caching 2

on:
  workflow_dispatch:
    inputs:
      use_cache:
        description: "Whether to use caching"
        required: true
        default: true
        type: boolean
      node-version:
        description: "Node.js version to use"
        required: true
        default: "26.x"
        type: choice
        options:
          - "26.x"
          - "25.x"
          - "24.x"
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 13-caching/react-app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ github.event.inputs.node-version }}
      - name: Download cache dependencies
        uses: actions/cache@v5
        if: ${{ github.event.inputs.use_cache }}
        id: cache-deps
        with:
          path: 13-caching/react-app/node_modules
          key: deps-node-modules-${{ hashFiles('13-caching/react-app/package-lock.json') }}
      - name: Install dependencies
        run: npm ci
      - name: Testing
        run: npm run test
      - name: Build
        run: npm run build
      - name: Deploy to non-production
        run: echo "Deploying to non-production environment"

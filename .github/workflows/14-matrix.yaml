name: 14 - Working wirth Matrices

on:
  workflow_dispatch:

jobs:
  backwards-compatibility:
    name: ${{ matrix.os }} - Node.js ${{ matrix.node-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node-version: [22.x, 24.x, 26.x]
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
      - name: Perform tests
        run: echo "Running tests on Node.js ${{ matrix.node-version }} and OS ${{ matrix.os }}"

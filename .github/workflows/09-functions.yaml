name: 09 - Using Functions

on:
  pull_request:
  workflow_dispatch:

jobs:
  echo1:
    runs-on: ubuntu-latest
    steps:
      - name: Print PR title
        run: echo "${{ github.event.pull_request.title }}"
      - name: Print PR labels
        run: |
          cat << EOF
          ${{ toJSON(github.event.pull_request.labels) }}
          EOF
      - name: Bug Step
        if: ${{ !cancelled() && contains(github.event.pull_request.title, 'fix') }}
        run: echo 'I'm a bugfix'
      - name: Sleep for 10 seconds
        run: sleep 10
      - name: Failing step
        run: exit 1
      - name: I will be skipped if previous step fails
        if: ${{ success() }}
        run: echo "I will print if previous step succeed"
      - name: I will execute
        if: ${{ failure() }}
        run: echo "I will print if any previous step fails."
      - name: I will execute
        if: ${{ !cancelled()}}
        run: echo "I will print if the workflow is not cancelled."
      - name: I will execute when cancelled
        if: ${{ cancelled() }}
        run: echo "I will print if the workflow is cancelled."

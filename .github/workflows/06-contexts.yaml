name: 06 - Contexts
run-name: Show Contexts and Variables runner | DEBUG - ${{inputs.debug}}
on:
  workflow_dispatch:
    inputs:
      debug:
        type: boolean
        default: false

env:
  MY_WORKFLOW: "workflow"
  MY_OVERWRITTEN_VAR: "workflow"

jobs:
  echo:
    runs-on: ubuntu-latest
    env:
      MY_JOB: "job"
      MY_OVERWRITTEN_VAR: "overwritten in job"
    steps:
      - name: Show Contexts
        run: |
          echo "Event name ${{ github.event_name }}"
          echo "Repository ${{ github.repository }}"
          echo "Actor ${{ github.actor }}"
          echo "Ref ${{ github.ref }}"
          echo "SHA ${{ github.sha }}"
          echo "Workflow ${{ github.workflow }}"
          echo "Action ${{ github.action }}"
          echo "Event path ${{ github.event_path }}"
          echo "Server URL ${{ github.server_url }}"

      - name: Retrieve Variables
        run: |
          echo "Variable value ${{vars.MY_VAR}}"
      - name: Print Env Variables
        env:
          MY_OVERWRITTEN_VAR: "overwritten in step"
        run: |
          echo "Workflow env: ${{ env.MY_WORKFLOW }}"
          echo "Overwritten env: ${{ env.MY_OVERWRITTEN_VAR }}"
          echo "Job env: ${{ env.MY_JOB }}"
          echo "Debug input: ${{ inputs.debug }}"
      - name: Print Step Env Variable
        run: |
          echo "Step overwritten env: ${{ env.MY_OVERWRITTEN_VAR }}"
          echo "Workflow env: ${{ env.MY_WORKFLOW }}"
          echo "Job env: ${{ env.MY_JOB }}"

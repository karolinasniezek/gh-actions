name: Cache Node and NPM dependencies
description: A composite action to cache Node and NPM dependencies based on the package-lock.json file

inputs:
  node-version:
    description: "Node.js version to use"
    default: 26.x
    required: true
  working-directory:
    description: "Working directory for the action"
    default: .
    required: false
  target-env:
    description: "dev or prod. Control whether dev dependencies are installed"
    default: dev
    required: false

runs:
  using: composite
  steps:
    - name: Setup NodeJS version ${{inputs.node-version}}
      uses: actions/setup-node@v3
      with:
        node-version: ${{inputs.node-version}}
    - name: Cache dependencies
      id: cache
      uses: actions/cache@v5
      with:
        path: ${{inputs.working-directory}}/node_modules
        key: node-modules-${{ hashFiles('${{inputs.working-directory}}/package-lock.json') }}
    - name: Install dependencies
      if: steps.cache.outputs.cache-hit != 'true'
      run: ${{ inputs.target-env == 'dev' && 'npm ci' || 'npm ci --omit=dev' }}
      shell: bash
      working-directory: ${{inputs.working-directory}}
